global:
  scrape_interval: 5s
  evaluation_interval: 5s

# rule_files and scrape_configs only: retention is not a config-file field
# in Prometheus (it is rejected at startup), so the time/size bounds live in
# docker-compose.yml as --storage.tsdb.retention.* command flags.

rule_files:
  - alerts.yml

scrape_configs:
  - job_name: res
    # docker-compose.yml sets RES_METRICS_TOKEN + RES_PROTECT_METRICS=true, so
    # /metrics accepts only this dedicated metrics bearer token (not the
    # administrator API credential).
    authorization:
      type: Bearer
      credentials: res-metrics-token
    static_configs:
      - targets: ["res:8080"]

  - job_name: prometheus
    # The self-scrape must authenticate too: the server enforces HTTP basic
    # auth on every endpoint (deploy/prometheus/web.config.yml). Plaintext
    # password here (client-side basic_auth); same user as
    # RES_PROMETHEUS_PASSWORD in docker-compose.yml.
    basic_auth:
      username: prom
      password: res-prometheus-pw
    static_configs:
      - targets: ["localhost:9090"]

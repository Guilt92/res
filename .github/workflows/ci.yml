name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  rust:
    name: Rust (fmt, clippy, build, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo build --release --locked
      # Unit and integration tests. They bind loopback ephemeral ports only
      # (never port 53) and must run as an unprivileged user (GitHub runners do).
      - run: cargo test --locked --no-fail-fast

  msrv:
    name: MSRV (Rust 1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked --all-targets
      - run: cargo test --locked --lib

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit --file Cargo.lock

  dashboard:
    name: Dashboard (JS checks + Playwright)
    runs-on: ubuntu-latest
    needs: []
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/e2e/package-lock.json
      - name: Install e2e tooling
        working-directory: tests/e2e
        run: npm ci
      - name: JavaScript syntax and lint (no-undef)
        working-directory: tests/e2e
        run: |
          npm run check
          npm run lint
      - run: cargo build --release --locked
      - name: Start gateway (unprivileged test ports)
        run: tests/e2e/start-gateway.sh target/release/res "$RUNNER_TEMP/res-e2e" 15353 8099
      - name: Install Chromium
        working-directory: tests/e2e
        run: npx playwright install --with-deps chromium
      - name: Playwright smoke tests
        working-directory: tests/e2e
        run: npx playwright test
      - name: Stop gateway
        if: always()
        run: kill "$(cat "$RUNNER_TEMP/res-e2e/res.pid")" || true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: tests/e2e/test-results
          if-no-files-found: ignore

groups:
  - name: res
    rules:
      - alert: ResMetricsAbsent
        expr: absent(up{job="res"}) or up{job="res"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Gateway metrics are unavailable"
          description: "Prometheus has not scraped res successfully for over a minute; availability, error and capacity signals are blind."

      - alert: ResNoActiveUpstreams
        expr: sum(res_active_upstreams) == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "No enabled upstreams"
          description: "Every configured upstream is disabled or none is configured; the gateway cannot resolve queries."

      - alert: ResNoUsableUpstreams
        expr: sum(res_active_upstreams) > 0 and sum(res_usable_upstreams) == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "No usable upstreams"
          description: "Every enabled upstream is UNHEALTHY; clients are receiving SERVFAIL."

      - alert: ResNoHealthyUpstreams
        expr: sum(res_active_upstreams) > 0 and sum(res_healthy_upstreams) == 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "No fully healthy upstreams"
          description: "Degraded or recovering upstreams may still be serving; investigate why no upstream passes its health checks."

      - alert: ResSingleHealthyUpstream
        expr: sum(res_healthy_upstreams) == 1
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Only one healthy upstream"
          description: "Redundancy is lost; a second failure may leave only degraded/recovering upstreams or trigger an outage."

      - alert: ResUpstreamUnhealthy
        expr: res_upstream_state == 0 and on(upstream) res_upstream_enabled == 1
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Upstream {{ $labels.upstream }} is unhealthy"
          description: "State has been unhealthy for over a minute."

      - alert: ResUpstreamFlapping
        expr: increase(res_upstream_state_changes_total[10m]) > 4 and on(upstream) res_upstream_enabled == 1
        for: 0s
        labels:
          severity: warning
        annotations:
          summary: "Upstream {{ $labels.upstream }} is flapping"
          description: "More than 4 health-state changes in 10 minutes; investigate the upstream or probe config."

      - alert: ResElevatedQueryErrors
        expr: rate(res_query_errors_total[5m]) > 1
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Elevated query error rate"
          description: "More than 1 query error/second over 5 minutes."

      - alert: ResElevatedFailovers
        expr: rate(res_upstream_failovers_total[5m]) > 0.5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Elevated failover rate"
          description: "More than 0.5 failovers/second over 5 minutes; upstreams are unstable."

      - alert: ResHighTimeoutRate
        expr: >
          rate(res_upstream_timeouts_total[5m])
            / clamp_min(rate(res_upstream_queries_total[5m]), 0.001) > 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Upstream {{ $labels.upstream }} timeout rate above 10%"
          description: "More than 10% of attempts to this upstream time out."

      - alert: ResHighUpstreamLatency
        expr: >
          histogram_quantile(0.95,
            sum by (le, upstream) (rate(res_upstream_latency_seconds_bucket[5m]))
          ) > 0.5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Upstream {{ $labels.upstream }} p95 latency above 500ms"
          description: "The 95th-percentile response time for this upstream exceeds 500ms for 5 minutes."

      - alert: ResCacheHitRateLow
        expr: >
          rate(res_cache_hits_total[10m])
            / clamp_min(rate(res_cache_hits_total[10m]) + rate(res_cache_misses_total[10m]), 0.001) < 0.3
            and rate(res_cache_misses_total[10m]) > 1
        for: 10m
        labels:
          severity: info
        annotations:
          summary: "Cache hit rate below 30%"
          description: "The cache is barely helping under real traffic; check TTL settings and query diversity."

      - alert: ResMemoryHigh
        expr: res_resident_memory_bytes > 384 * 1024 * 1024
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Gateway memory above 384 MiB"
          description: "Resident memory is above 75% of the default 512 MiB Compose limit; check cache max_entries and traffic volume. Update this rule if RES_MEMORY_LIMIT is overridden."

      - alert: ResMemoryCritical
        expr: res_resident_memory_bytes > 460 * 1024 * 1024
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Gateway memory near its container limit"
          description: "Resident memory is above ~90% of the default 512 MiB Compose limit; an OOM kill is imminent. Raise RES_MEMORY_LIMIT or reduce cache/traffic tables."

      - alert: ResCPUSaturated
        expr: res_cpu_percent > 80
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Gateway CPU sustained above 80% of one core"
          description: "The process has exceeded 80% of one core for 10 minutes; the default Compose CPU limit is 1.0. Raise RES_CPU_LIMIT or investigate query load/failover loops."

      - alert: ResFileDescriptorsHigh
        expr: res_open_fds > 48000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Gateway file descriptors above 48000"
          description: "Open FDs are approaching the 65536 Compose ulimit; check for TCP connection leaks or raise the nofile limit."

      - alert: ResOverloadDrops
        expr: increase(res_overload_dropped_total[5m]) > 100
        for: 0s
        labels:
          severity: warning
        annotations:
          summary: "Queries dropped due to overload"
          description: "More than 100 queries shed in 5 minutes; increase capacity or investigate the cause."

      - alert: ResRateLimitDrops
        expr: increase(res_rate_limit_dropped_total[5m]) > 100
        for: 0s
        labels:
          severity: info
        annotations:
          summary: "Rate limiter dropping queries"
          description: "More than 100 rate-limited queries in 5 minutes; expected under abuse."

      - alert: ResConfigErrors
        expr: increase(res_config_errors_total[10m]) > 0
        for: 0s
        labels:
          severity: warning
        annotations:
          summary: "Configuration reload errors"
          description: "A config reload failed; the previous config remains active."

      - alert: ResMonitoringDown
        expr: up{job="prometheus"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Prometheus is down"
          description: "The monitoring stack is unavailable; gateway metrics are not being scraped."

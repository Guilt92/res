# res full stack: gateway + Prometheus + Grafana. No database.
#
# Credentials are PLAIN TEXT in this file — intentional for this deployment
# (no secrets manager). Set in one place, enforced by each application:
#   RES_ADMIN_PASSWORD / RES_VIEWER_PASSWORD   dashboard users "admin"/"viewer" :8080
#   GF_SECURITY_ADMIN_PASSWORD                 Grafana user "admin"             :3000
#   deploy/prometheus/web.config.yml           Prometheus user "prom"           :9090
#   RES_API_TOKEN                              gateway metrics scrape bearer    :8080/metrics
# The gateway's Prometheus proxy authenticates with RES_PROMETHEUS_USERNAME/
# RES_PROMETHEUS_PASSWORD, and the Grafana datasource carries the same user
# (deploy/grafana/provisioning/datasources/prometheus.yml).
#
# Start:   docker compose up -d --build
# DNS:     dig @127.0.0.1 example.com          (host port 53 -> container 53)
#          If something on the host already owns :53 (systemd-resolved,
#          another resolver), override the publish port without editing
#          this file:  RES_DNS_PUBLISH=5353 docker compose up -d
#          then:        dig @127.0.0.1 -p 5353 example.com
# API:     http://localhost:8080/  (dashboard; admin / RES_ADMIN_PASSWORD)
# Metrics: http://localhost:9090/  (Prometheus; prompt for prom / web.config.yml)
# Charts:  http://localhost:3000/  (Grafana; admin / GF_SECURITY_ADMIN_PASSWORD)

services:
  res:
    build:
      context: .
      # Host networking + proxy args let the builder reach crates.io behind a
      # localhost-only HTTP proxy; harmless on networks without a proxy.
      network: host
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        ALL_PROXY: ${ALL_PROXY:-}
        NO_PROXY: ${NO_PROXY:-}
    environment:
      # Dashboard time-series proxy: query Prometheus directly by its
      # in-network DNS name (overrides [monitoring].prometheus_url).
      RES_PROMETHEUS_URL: http://prometheus:9090
      # Prometheus enforces HTTP basic auth (deploy/prometheus/web.config.yml);
      # the gateway proxy authenticates its queries with these credentials.
      RES_PROMETHEUS_USERNAME: "prom"
      RES_PROMETHEUS_PASSWORD: "res-prometheus-pw"
      # Control-plane credentials (plain text by request for this deployment;
      # hashed with argon2 at startup, never written to the TOML config —
      # only argon2 hashes land in config/res.credentials, mode 0600).
      # Users: "admin" (full access) and "viewer" (read-only).
      RES_ADMIN_PASSWORD: "res-dashboard-pw"
      RES_VIEWER_PASSWORD: "res-viewer-pw"
      # Metrics are scraped by Prometheus with this bearer token; the gateway
      # rejects unauthenticated /metrics requests with 401.
      RES_API_TOKEN: "res-metrics-token"
      RES_PROTECT_METRICS: "true"
    volumes:
      # Whole directory (rw): the gateway rewrites the config atomically via
      # temp-file + fsync + rename and keeps a .backup next to it.
      - ./config:/etc/res:rw
      - ./dashboard:/app/dashboard:ro
    ports:
      # Host publish port is overridable (e.g. systemd-resolved owns :53):
      #   RES_DNS_PUBLISH=5353 docker compose up -d
      - "${RES_DNS_PUBLISH:-53}:53/udp"
      - "${RES_DNS_PUBLISH:-53}:53/tcp"
      - "8080:8080"
    # The gateway never writes to its root filesystem (config is a bind mount,
    # logs go to stdout/stderr). Keep it read-only and disallow privilege gain.
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.53.2
    # Retention is set via CLI flags: the config file rejects a top-level
    # `retention` field (it is not part of Prometheus' YAML schema).
    # 15 days / 2 GB keeps two weeks of incidents within a bounded store.
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--storage.tsdb.retention.size=2GB"
      # HTTP basic auth for Prometheus' own endpoints (UI/API/metrics).
      # Prometheus has no native env-var auth: this web config file is the
      # thing that actually enforces the username/password.
      - "--web.config.file=/etc/prometheus/web.config.yml"
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/alerts.yml:/etc/prometheus/alerts.yml:ro
      - ./deploy/prometheus/web.config.yml:/etc/prometheus/web.config.yml:ro
      # Persistent metrics store (retention flags above; 15 days / 2 GB).
      # Named volume survives restarts without polluting the repo tree.
      - prom-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      - res
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.1.4
    environment:
      # Plain text by request for this deployment (see header comment).
      # Grafana applies this admin password on every start (existing or
      # fresh database), so the value in this file is always authoritative.
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: "res-grafana-pw"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_AUTH_BASIC_ENABLED: "true"
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  prom-data:

[package]
name = "res"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "res - lightweight, health-aware DNS gateway/proxy"
license = "MIT"
publish = false

[lib]
name = "res"
path = "src/lib.rs"

[[bin]]
name = "res"
path = "src/main.rs"

[[bin]]
name = "res-loadtest"
path = "src/bin/loadtest.rs"

[[bin]]
name = "res-hotpath-bench"
path = "src/bin/hotpath-bench.rs"

[dependencies]
tokio = { version = "1", features = [
    "rt-multi-thread",
    "net",
    "time",
    "sync",
    "signal",
    "macros",
    "io-util",
] }
hickory-proto = "0.26"
axum = "0.8"
tower-http = { version = "0.7", features = ["fs"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls-pemfile = "1.0"
webpki-roots = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
prometheus = "0.14"
arc-swap = "1"
ipnet = { version = "2", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
thiserror = "2"
fastrand = "2"
argon2 = { version = "0.6", features = ["password-hash", "rand_core"] }
base64 = "0.22"
rand = "0.9"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

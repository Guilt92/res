[server]
udp_addr = "0.0.0.0:53"
tcp_addr = "0.0.0.0:53"
api_addr = "0.0.0.0:8080"
dashboard_dir = "dashboard"
max_udp_packet_size = 4096
max_inflight_udp = 8192
max_tcp_connections = 512
max_queries_per_tcp_conn = 100
tcp_idle_timeout_ms = 10000
upstream_tcp_fallback = true
shutdown_grace_ms = 5000
api_token = "res-metrics-token"

[auth]
username = "admin"
viewer_username = "viewer"
session_ttl = "720m"
max_failed_attempts = 5
lockout_window = "15m"
lockout_duration = "15m"
protect_metrics = true
secure_cookies = false
allow_open_mode = false
login_rate_limit_per_minute = 30

[query]
timeout = "2s"
upstream_timeout = "500ms"
max_attempts = 3
any_policy = "refuse"

[acl]
allowed_cidrs = []
denied_cidrs = []

[[acl.entries]]
id = "allow:127.0.0.0/8"
cidr = "127.0.0.0/8"
action = "allow"
enabled = true

[[acl.entries]]
id = "allow:::1/128"
cidr = "::1/128"
action = "allow"
enabled = true

[[acl.entries]]
id = "allow:10.0.0.0/8"
cidr = "10.0.0.0/8"
action = "allow"
enabled = true

[[acl.entries]]
id = "allow:172.16.0.0/12"
cidr = "172.16.0.0/12"
action = "allow"
enabled = true

[[acl.entries]]
id = "allow:192.168.0.0/16"
cidr = "192.168.0.0/16"
action = "allow"
enabled = true

[[acl.entries]]
id = "allow:169.254.0.0/16"
cidr = "169.254.0.0/16"
action = "allow"
enabled = true

[[acl.entries]]
id = "allow:fc00::/7"
cidr = "fc00::/7"
action = "allow"
enabled = true

[ratelimit]
enabled = true
per_ip_qps = 50.0
per_ip_burst = 100
max_tracked_clients = 65536
global_qps = 50000.0
global_burst = 100000

[failover]
retry_on_servfail = false

[health]
enabled = true
interval = "5s"
timeout = "2s"
failure_threshold = 3
recovery_threshold = 2
min_successes = 1
tcp_probes = false
dwell = "5s"

[[health.probes]]
name = "example.com"
type = "A"

[[health.probes]]
name = "example.com"
type = "AAAA"

[[health.probes]]
name = "."
type = "NS"

[selection]
strategy = "weighted_reliability"
latency_reference_ms = 50.0
tier_policy = "strict"
lower_tier_share = 0.0
degraded_policy = "usable"
min_probe_samples = 4

[cache]
enabled = true
max_entries = 4096
max_memory_bytes = 33554432
min_ttl_secs = 0
max_ttl_secs = 3600
negative_max_ttl_secs = 30

[logging]
format = "json"
filter = "info"
servfail_sample_every = 0

[monitoring]
prometheus_url = "http://prometheus:9090"
prometheus_username = "prom"
client_ip_privacy = "masked"
top_clients_max = 4096
top_domains_max = 8192
client_metrics_max = 100

[[upstreams]]
id = 1
name = "cloudflare-1"
address = "1.1.1.1"
port = 53
protocol = "udp"
enabled = true
priority = 1
weight = 1

[[upstreams]]
id = 2
name = "cloudflare-2"
address = "1.0.0.1"
port = 53
protocol = "udp"
enabled = false
priority = 1
weight = 1

[[upstreams]]
id = 3
name = "google-1"
address = "8.8.8.8"
port = 53
protocol = "udp"
enabled = true
priority = 2
weight = 1

[[upstreams]]
id = 4
name = "google-2"
address = "8.8.4.4"
port = 53
protocol = "udp"
enabled = true
priority = 2
weight = 1

[[upstreams]]
id = 5
name = "quad9-1"
address = "9.9.9.9"
port = 53
protocol = "udp"
enabled = true
priority = 3
weight = 1

[[upstreams]]
id = 6
name = "quad9-2"
address = "149.112.112.112"
port = 53
protocol = "udp"
enabled = true
priority = 3
weight = 1

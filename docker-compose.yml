# res full stack: gateway + Prometheus + Grafana. No database.
#
# Secure by default: NO default credentials are shipped and the management
# interface is bound to the host loopback. The gateway fails closed at startup
# without an explicit admin password. Before the first `docker compose up`,
# set the required variables in your environment (or a `.env` file):
#   RES_ADMIN_PASSWORD                 dashboard/API admin login
#   RES_METRICS_TOKEN                  metrics-only scrape bearer (must match
#                                      deploy/prometheus.yml `credentials`)
# The Prometheus/Grafana monitoring services are development placeholders:
# their credentials (deploy/prometheus/web.config.yml bcrypt hash,
# deploy/prometheus.yml, the Grafana datasource and GF_SECURITY_ADMIN_PASSWORD)
# are loopback-only but MUST be changed before any exposure.
#
# Start:   export RES_ADMIN_PASSWORD=... RES_METRICS_TOKEN=... && docker compose up -d --build
# DNS:     dig @127.0.0.1 -p 153 example.com          (host port 153 -> container 53)
#          If you want the standard :53, override the publish port without
#          editing this file:  RES_DNS_PUBLISH=53 docker compose up -d
#          then:                dig @127.0.0.1 example.com
# API:     http://127.0.0.1:8080/  (dashboard, loopback only; admin / RES_ADMIN_PASSWORD)
#          Expose beyond loopback with RES_DASHBOARD_PUBLISH=0.0.0.0 only over
#          HTTPS or a trusted reverse proxy (and keep RES_SECURE_COOKIES=true).
# Metrics: http://localhost:9090/  (Prometheus; loopback; prompt for web.config.yml)
# Charts:  http://127.0.0.1:3000/  (Grafana; loopback; admin / GF_SECURITY_ADMIN_PASSWORD)

services:
  res:
    build:
      context: .
      # Proxy arguments are forwarded to Cargo for restricted networks. Host
      # networking lets the builder use a proxy bound to the host loopback;
      # set BUILD_NETWORK=default where host networking is unavailable.
      network: ${BUILD_NETWORK:-host}
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        ALL_PROXY: ${ALL_PROXY:-}
        NO_PROXY: ${NO_PROXY:-}
    environment:
      # Dashboard time-series proxy: query Prometheus directly by its
      # in-network DNS name (overrides [monitoring].prometheus_url).
      RES_PROMETHEUS_URL: http://prometheus:9090
      # Prometheus enforces HTTP basic auth (deploy/prometheus/web.config.yml);
      # the gateway proxy authenticates its queries with these credentials.
      # The value MUST match deploy/prometheus.yml, the bcrypt hash in
      # deploy/prometheus/web.config.yml and the Grafana datasource.
      RES_PROMETHEUS_USERNAME: "prom"
      RES_PROMETHEUS_PASSWORD: "change-me-prometheus-password"
      # No default credentials: the gateway refuses to start unless an admin
      # password is supplied (or a res.credentials file is mounted). Set these
      # in your environment / .env; hashes land in config/res.credentials.
      RES_ADMIN_PASSWORD: "${RES_ADMIN_PASSWORD:?set RES_ADMIN_PASSWORD (dashboard admin login) in your environment or .env}"
      RES_VIEWER_PASSWORD: "${RES_VIEWER_PASSWORD:-}"
      # Metrics are scraped by Prometheus with this dedicated, metrics-only
      # bearer token. It cannot read or change the API. Must match the
      # `credentials` value in deploy/prometheus.yml. With RES_PROTECT_METRICS
      # on, /metrics rejects every request (fail closed) until it is set.
      RES_METRICS_TOKEN: "${RES_METRICS_TOKEN:?set RES_METRICS_TOKEN (metrics scrape token) in your environment or .env}"
      RES_PROTECT_METRICS: "true"
      # Mark session/CSRF cookies Secure. The management interface is served
      # on the host loopback (a potentially-trustworthy origin), so login over
      # http://127.0.0.1:8080 keeps working with Secure cookies.
      RES_SECURE_COOKIES: "true"
    # The image defaults to UID/GID 10001; the host ./config bind mount is
    # what needs to be writable (atomic config rewrite + res.credentials), so
    # the container UID defaults to the usual host user. Override with
    # RES_UID/RES_GID if ./config is owned by another account.
    user: "${RES_UID:-1000}:${RES_GID:-1000}"
    volumes:
      # Whole directory (rw): the gateway rewrites the config atomically via
      # temp-file + fsync + rename and keeps a .backup next to it.
      - ./config:/etc/res:rw
      - ./dashboard:/app/dashboard:ro
    ports:
      # Host publish port is overridable (e.g. systemd-resolved owns :53):
      #   RES_DNS_PUBLISH=53 docker compose up -d
      - "${RES_DNS_PUBLISH:-153}:53/udp"
      - "${RES_DNS_PUBLISH:-153}:53/tcp"
      # Management interface: bound to the host LOOPBACK by default so the
      # dashboard/API is never exposed to the network without an explicit
      # choice. Expose it only over HTTPS or a trusted reverse proxy:
      #   RES_DASHBOARD_PUBLISH=0.0.0.0 docker compose up -d
      - "127.0.0.1:${RES_DASHBOARD_PUBLISH:-8080}:8080"
    # The gateway never writes to its root filesystem (config is a bind mount,
    # logs go to stdout/stderr). Keep it read-only and disallow privilege gain.
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Unprivileged port 53 does not need CAP_NET_BIND_SERVICE when the
    # kernel's unprivileged-port floor is at or below 53 (Docker's default
    # is 0; this makes it explicit and works on stricter runtimes too).
    sysctls:
      net.ipv4.ip_unprivileged_port_start: "53"
    # Bounded production footprint. Override through the environment when the
    # host has different capacity; the matching alert thresholds in
    # deploy/alerts.yml assume the 512 MiB default (warning 384 MiB, critical
    # 460 MiB), so update both together.
    deploy:
      resources:
        limits:
          cpus: "${RES_CPU_LIMIT:-1.0}"
          memory: "${RES_MEMORY_LIMIT:-512M}"
          pids: 256
        reservations:
          cpus: "${RES_CPU_RESERVATION:-0.25}"
          memory: "${RES_MEMORY_RESERVATION:-64M}"
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    # The process handles SIGTERM and drains for up to server.shutdown_grace_ms
    # (5s by default); leave room for in-flight forwards.
    stop_grace_period: 20s
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.53.2
    # Retention is set via CLI flags: the config file rejects a top-level
    # `retention` field (it is not part of Prometheus' YAML schema).
    # 15 days / 2 GB keeps two weeks of incidents within a bounded store.
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--storage.tsdb.retention.size=2GB"
      # HTTP basic auth for Prometheus' own endpoints (UI/API/metrics).
      # Prometheus has no native env-var auth: this web config file is the
      # thing that actually enforces the username/password.
      - "--web.config.file=/etc/prometheus/web.config.yml"
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/alerts.yml:/etc/prometheus/alerts.yml:ro
      - ./deploy/prometheus/web.config.yml:/etc/prometheus/web.config.yml:ro
      # Persistent metrics store (retention flags above; 15 days / 2 GB).
      # Named volume survives restarts without polluting the repo tree.
      - prom-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      - res
    deploy:
      resources:
        limits:
          cpus: "${PROMETHEUS_CPU_LIMIT:-0.5}"
          memory: "${PROMETHEUS_MEMORY_LIMIT:-512M}"
          pids: 512
        reservations:
          cpus: "${PROMETHEUS_CPU_RESERVATION:-0.1}"
          memory: "${PROMETHEUS_MEMORY_RESERVATION:-128M}"
    stop_grace_period: 30s
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.1.4
    environment:
      # Development placeholder (see header comment). Grafana applies this
      # admin password on every start, so the value here is authoritative.
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: "change-me-grafana-password"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_AUTH_BASIC_ENABLED: "true"
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      # Loopback-only by default: Grafana is a management interface too.
      - "127.0.0.1:${RES_GRAFANA_PUBLISH:-3000}:3000"
    depends_on:
      - prometheus
    deploy:
      resources:
        limits:
          cpus: "${GRAFANA_CPU_LIMIT:-0.5}"
          memory: "${GRAFANA_MEMORY_LIMIT:-256M}"
          pids: 512
        reservations:
          cpus: "${GRAFANA_CPU_RESERVATION:-0.1}"
          memory: "${GRAFANA_MEMORY_RESERVATION:-64M}"
    stop_grace_period: 30s
    restart: unless-stopped

volumes:
  prom-data:
